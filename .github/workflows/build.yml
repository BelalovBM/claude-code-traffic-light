# Builds the program from the sources of the repository and, for a v* tag, attaches it to the release. Once SignPath
# Foundation has accepted the project, the commented block has the file signed first.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The compiler of the same SDK as on the author's computer, so the file here is byte for byte the one built there.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.313'

      - name: Build (the same sources give the same file)
        shell: pwsh
        env:
          TRAFFICLIGHT_SDK: '9.0.313'
        run: ./tools/make-release.ps1 -NoStart

      # A failed check stops the build here, before anything is released.
      - name: Unit tests
        shell: pwsh
        run: ./tools/run-tests.ps1

      - name: Show the checksums (compare with SHA256SUMS.txt of the author's build)
        shell: pwsh
        run: Get-Content Release/SHA256SUMS.txt

      - name: Upload the unsigned file
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: bin/ClaudeCodeTrafficLight.exe

      # --- Switch this block on after SignPath Foundation has accepted the project (see PUBLISH.md) ---
      # - name: Sign with SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
      #     organization-id: '<SIGNPATH_ORGANIZATION_ID>'
      #     project-slug: 'ClaudeCodeTrafficLight'
      #     signing-policy-slug: 'release-signing'
      #     github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
      #     wait-for-completion: true
      #     output-artifact-directory: 'signed'
      # After signing, take signed/ClaudeCodeTrafficLight.exe for the release instead of the one in Release/ and
      # recompute SHA256SUMS.txt.

      # The text of the release is the section of CHANGELOG.md for this version ("## 0.9.0 ..." up to the next "## ").
      - name: Release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = [array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -match "^## $([regex]::Escape($version))\b" })
          $body = @('See CHANGELOG.md.')
          if ($start -ge 0)
          {
              $end = [array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l -match '^## ' })
              if ($end -lt 0) { $end = $lines.Count }
              $body = @($lines[($start + 1)..($end - 1)])
              while ($body.Count -gt 0 -and $body[-1].Trim() -eq '') { $body = @($body[0..($body.Count - 2)]) }
          }
          $body | Set-Content release-notes.md -Encoding utf8
          # Whoever comes straight to the download page gets the first steps too; the rest is in the program and the readme.
          $repo = '${{ github.server_url }}/${{ github.repository }}'
          @(
              '',
              '**Getting started:** download `ClaudeCodeTrafficLight.exe` below, run it, and answer **Yes** to "Connect to Claude Code". It is not code-signed, so Windows SmartScreen may warn on the first start: **More info → Run anyway**. Check the file against `SHA256SUMS.txt` if you like.',
              '',
              "Everything else is explained in the program itself (the first-run window and the **About** page) and in the [README]($repo#readme). The source zip is only needed to build the program yourself."
          ) | Add-Content release-notes.md -Encoding utf8

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          # A normal release even for 0.x: GitHub hides pre-releases from the repository page and from /releases/latest.
          # The version number and the README say it is a beta.
          prerelease: false
          make_latest: true
          files: |
            Release/ClaudeCodeTrafficLight.exe
            Release/SHA256SUMS.txt
            Source/*.zip